<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>GPU and CPU stress test icon</title>
  <defs>
    <linearGradient id="flame" x1="0.12" y1="0.12" x2="0.86" y2="0.88">
      <stop offset="0" stop-color="#ff3028"/>
      <stop offset="0.48" stop-color="#ff5a00"/>
      <stop offset="1" stop-color="#ffb900"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb900"/>
      <stop offset="0.52" stop-color="#ff5a00"/>
      <stop offset="1" stop-color="#ff3028"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0.2" y1="0.05" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fff6a6"/>
      <stop offset="0.48" stop-color="#ffd52e"/>
      <stop offset="1" stop-color="#ff9b00"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#292936"/>
      <stop offset="1" stop-color="#171720"/>
    </linearGradient>
  </defs>

  <!-- Flame ring; the inner contour is a real transparent cut-out. -->
  <path fill="url(#flame)" fill-rule="evenodd" d="
    M 112,548
    C 62,474 93,368 165,299
    C 153,366 187,366 207,315
    C 231,253 275,204 347,165
    C 318,235 355,269 397,233
    C 436,199 416,129 492,62
    C 477,157 541,171 576,225
    C 612,280 585,322 630,333
    C 676,344 696,291 684,246
    C 757,322 784,415 751,500
    C 721,579 657,635 573,671
    C 486,708 373,712 273,681
    C 194,657 139,611 112,548 Z

    M 257,493
    C 275,410 344,345 431,322
    C 499,304 563,321 603,363
    C 637,399 638,451 605,490
    C 566,536 494,563 424,579
    C 356,594 292,579 264,544
    C 252,529 250,511 257,493 Z"/>

  <!-- Sweeping orbital stroke, intentionally open and transparent inside. -->
  <path d="M 89,710
           C 37,790 76,856 173,854
           C 287,851 426,780 535,709"
        fill="none" stroke="url(#orbit)" stroke-width="43"
        stroke-linecap="round"/>
  <path d="M 704,303
           C 817,238 931,244 950,313
           C 965,367 927,420 883,462"
        fill="none" stroke="url(#orbit)" stroke-width="39"
        stroke-linecap="round"/>

  <!-- CPU pins. Gaps between pins remain transparent. -->
  <g fill="#20202b">
    <rect x="674" y="389" width="34" height="92" rx="17"/>
    <rect x="748" y="389" width="34" height="92" rx="17"/>
    <rect x="822" y="389" width="34" height="92" rx="17"/>
    <rect x="896" y="389" width="34" height="92" rx="17"/>
    <rect x="674" y="839" width="34" height="92" rx="17"/>
    <rect x="748" y="839" width="34" height="92" rx="17"/>
    <rect x="822" y="839" width="34" height="92" rx="17"/>
    <rect x="896" y="839" width="34" height="92" rx="17"/>
    <rect x="581" y="486" width="92" height="34" rx="17"/>
    <rect x="581" y="560" width="92" height="34" rx="17"/>
    <rect x="581" y="634" width="92" height="34" rx="17"/>
    <rect x="581" y="708" width="92" height="34" rx="17"/>
    <rect x="931" y="486" width="92" height="34" rx="17"/>
    <rect x="931" y="560" width="92" height="34" rx="17"/>
    <rect x="931" y="634" width="92" height="34" rx="17"/>
    <rect x="931" y="708" width="92" height="34" rx="17"/>
  </g>

  <!-- Chip body; the # is solid white, not an outline. -->
  <rect x="645" y="455" width="322" height="414" rx="64" fill="url(#chip)"/>
  <path d="M 705,492 H 907" stroke="#41414e" stroke-width="12" stroke-linecap="round" opacity=".55"/>

  <!-- Bold, filled hash glyph. -->
  <path fill="#ffffff" d="
    M 767,555
    L 818,555 L 808,613 L 860,613 L 870,555
    L 921,555 L 911,613 L 947,613 L 939,663
    L 902,663 L 892,721 L 929,721 L 921,771
    L 883,771 L 873,830 L 822,830 L 832,771
    L 780,771 L 770,830 L 719,830 L 729,771
    L 692,771 L 700,721 L 737,721 L 747,663
    L 710,663 L 718,613 L 755,613 Z
    M 798,663 L 788,721 L 840,721 L 850,663 Z"/>

  <!-- Lightning bolt sits above both motifs. -->
  <path d="M 739,312
           L 402,690
           L 548,690
           L 389,958
           L 790,566
           L 638,566 Z"
        fill="url(#bolt)" stroke="#ff8d00" stroke-width="10"
        stroke-linejoin="round"/>
</svg>
